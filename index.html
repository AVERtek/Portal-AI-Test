<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Portal Experience</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --primary-orange: #fa4616;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: white;
      overflow: hidden;
    }

    /* Cinematic Background */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      transition: transform 2s ease, filter 2s ease, opacity 1s ease;
    }

    .portal-active #bg-video {
      transform: scale(1.5);
      filter: blur(20px);
      opacity: 0.3;
    }

    /* Glassmorphism UI */
    .ui-card {
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .logo-image {
      max-width: 220px;
      display: block;
      margin: 20px auto;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
    }

    .headline {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    .scene-button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 400px;
      margin: 0 auto;
    }

    .scene-button {
      cursor: pointer;
      padding: 16px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .scene-button:hover {
      background: var(--primary-orange);
      transform: translateY(-2px);
      border-color: white;
    }

    .icon { width: 24px; height: 24px; object-fit: contain; }

    /* AR Elements */
    #arViewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    #arViewer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ar-launch-button {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 20px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      background: linear-gradient(45deg, #00cc66, #00ff88);
      color: black;
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 20px rgba(0, 204, 102, 0.3);
      cursor: pointer;
      display: none;
    }

    .close-ux {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 100;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      display: none;
    }

    /* Loading States */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--primary-orange);
      z-index: 1000;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s;
    }
  </style>
</head>
<body>

  <div id="loader"></div>
  
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="video/V7_best_8598739-uhd_3840_2160_30fps.mp4" type="video/mp4" />
  </video>

  <div id="main-ui" style="position: relative; z-index: 10; padding-top: 10vh;">
    <img class="logo-image" src="images/P11 Logo_w_trans.png" alt="Logo" />
    <h1 class="headline">The Future of Living</h1>
    
    <div class="scene-button-group">
      <div class="scene-button" onclick="enterPortal('Models/enter_the_portal_12.glb', 'Models/ENTER_THE_PORTAL_12.usdz', 'images/high_rez_apartment_360.jpg')">
        <img src="icons/Portal 2.png" class="icon" /> 
        <span>Enter the 360° Apartment Portal</span>
      </div>
      
      <div class="scene-button" onclick="window.open('video/Bailey_Final_1.mp4', '_blank')">
        <img src="icons/Dog icon 2.png" class="icon" /> 
        <span>Meet Bailey (Spokesmodel)</span>
      </div>

      <div class="scene-button" onclick="enterPortal('Models/the_charles_floorplan_final_v12.glb', 'Models/THE_CHARLES_FLOORPLAN_FINAL_v12C.usdz')">
        <img src="icons/Floorplan icon 3.jpg" class="icon" /> 
        <span>View 4D Walk-Through Model</span>
      </div>
    </div>
  </div>

  <button id="launchARBtn" class="ar-launch-button" onclick="activateAR()">START AR WALKTHROUGH</button>
  <button id="closeBtn" class="close-ux" onclick="exitPortal()">✕ EXIT PORTAL</button>

  <model-viewer id="arViewer"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    interaction-prompt="auto"
    shadow-intensity="1"
    exposure="1.2"
    environment-image="neutral"
    auto-rotate>
  </model-viewer>

  <script>
    const viewer = document.getElementById('arViewer');
    const bgVideo = document.getElementById('bg-video');
    const mainUI = document.getElementById('main-ui');
    const loader = document.getElementById('loader');
    const launchBtn = document.getElementById('launchARBtn');
    const closeBtn = document.getElementById('closeBtn');

    function enterPortal(glb, usdz, skyboxUrl) {
      // 1. Start Visual Transition
      document.body.classList.add('portal-active');
      mainUI.style.transition = "opacity 0.8s";
      mainUI.style.opacity = "0";
      
      setTimeout(() => {
        mainUI.style.display = "none";
        
        // 2. Load Model & Skybox
        viewer.src = glb;
        viewer.iosSrc = usdz;
        
        // This is key for the 360 high-rez view
        if(skyboxUrl) {
          viewer.skyboxImage = skyboxUrl;
          viewer.environmentImage = skyboxUrl;
        }

        viewer.classList.add('visible');
        launchBtn.style.display = "block";
        closeBtn.style.display = "block";
      }, 800);
    }

    function activateAR() {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      }
    }

    function exitPortal() {
      document.body.classList.remove('portal-active');
      viewer.classList.remove('visible');
      launchBtn.style.display = "none";
      closeBtn.style.display = "none";
      
      mainUI.style.display = "block";
      setTimeout(() => { mainUI.style.opacity = "1"; }, 10);
      
      viewer.src = ""; // Clean up memory
    }

    // Progress bar
    viewer.addEventListener('progress', (e) => {
      loader.style.transform = `scaleX(${e.detail.totalProgress})`;
      if(e.detail.totalProgress === 1) {
        setTimeout(() => { loader.style.transform = `scaleX(0)`; }, 500);
      }
    });
  </script>
</body>
</html>
