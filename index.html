<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Vault Portal Experience</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
     body {
      margin: 0;
      font-family: 'Area', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: white;
      background-color: black;
      overflow-x: hidden;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      transition: opacity 1s ease;
    }

    #bg-video.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo-image {
      max-width: 350px;
      display: block;
      margin: 40px auto 0 auto;
      padding: 20px;
      transition: transform 0.3s ease;
    }

    .headline {
      font-family: 'Area', sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: bold;
      color: white;
      text-align: center;
      margin: 0 auto;
      padding: 12px;
    }
    
    .ui-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-bottom: 50px;
    }

    .scene-button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 450px;
    }

    .scene-button {
      width: 90%;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: center;
      padding: 12px 16px;
      background: rgba(250,70,22,1); /* Original Orange */
      border: 1px solid white;
      font-size: 18px;
      color: white;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .icon {
      width: 28px;
      height: 28px;
      margin-right: 10px;
      object-fit: contain;
    }

    .ar-launch-button {
      position: fixed;
      top: 120px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: 20px 30px;
      font-size: 28px;
      background-color: #00cc66; /* Original Green */
      color: white;
      border: 2px solid white;
      border-radius: 12px;
      cursor: pointer;
      display: none;
    }

    .close-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 30;
      background: #ff4444; /* Original Red */
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      display: none;
    }

    model-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      display: none;
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 4px;
      background: #fa4616;
      z-index: 100;
    }

    .title-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <video id="bg-video" autoplay muted loop playsinline>
    <source src="video/V7_best_8598739-uhd_3840_2160_30fps.mp4" type="video/mp4" />
  </video>

  <div id="intro-title" class="title-overlay">
    <h1 style="text-align: center; padding: 20px;">Pre-Leasing Our Future Apartment Homes Today!</h1>
  </div>

  <div id="main-content">
    <img class="logo-image" src="images/P11 Logo_w_trans.png" alt="Logo" />
    <h1 class="headline">PRE-LEASING NOW!</h1>

    <div class="ui-overlay">
      <div class="scene-button-group">
        
        <div class="scene-button" onclick="launchAR('Models/Vault Animation_03.glb', 'Models/BankVault.reality', 'Sound/Building_Audio.mp3')">
          <img src="icons/Portal 2.png" class="icon" /> 4D/AR Vault: Unlock Our Future Now
        </div>

        <a href="https://g.co/gemini/share/6e6ac2763d4e" target="_blank" class="scene-button">
          <img src="icons/Story icon 3.png" class="icon" /> Storytime: Why Apartment Home Living
        </a>

        <a href="video/Bailey_Final_1.mp4" target="_blank" class="scene-button">
          <img src="icons/Dog icon 2.png" class="icon" /> Spokesmodel: Meet Bailey
        </a>

        <div class="scene-button" onclick="launchAR('Models/the_charles_floorplan_final_v12.glb', 'Models/THE_CHARLES_FLOORPLAN_FINAL_v12C.usdz', 'Sound/Charles_FP_Audio.mp3')">
          <img src="icons/Floorplan icon 3.jpg" class="icon" /> 4D/AR Floorplan: Walk-Through Model
        </div>

        <a href="https://avertek.github.io/Portal-Breadcrumb/" target="_blank" class="scene-button">
          <img src="icons/Breadcrumb 1 icon.png" class="icon" /> Breadcrumb Links: Get Inside Info!
        </a>

      </div>
    </div>
  </div>

  <button id="arLaunchBtn" class="ar-launch-button" onclick="activateAR()">Experience 4D/AR</button>
  <button id="closeBtn" class="close-button" onclick="closeAR()">✖ Close UX</button>

  <model-viewer id="arViewer"
    ar ar-modes="webxr scene-viewer quick-look"
    camera-controls
    autoplay
    animation-name="*" 
    shadow-intensity="1"
    environment-image="neutral"
    interaction-prompt="none">
  </model-viewer>

  <audio id="arAudio" preload="auto"></audio>

  <script>
    const viewer = document.getElementById('arViewer');
    const arBtn = document.getElementById('arLaunchBtn');
    const closeBtn = document.getElementById('closeBtn');
    const arAudio = document.getElementById('arAudio');
    const mainContent = document.getElementById('main-content');
    const bgVideo = document.getElementById('bg-video');

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('intro-title').style.opacity = '0';
        setTimeout(() => document.getElementById('intro-title').style.display = 'none', 1000);
      }, 3000);
    });

    function launchAR(glb, iosSrc, audioPath) {
      mainContent.style.display = 'none';
      bgVideo.style.opacity = '0.3';
      
      viewer.style.display = 'block';
      viewer.src = glb;
      // Using ios-src for the BankVault.reality file
      viewer.setAttribute('ios-src', iosSrc);

      if(audioPath) {
        arAudio.src = audioPath;
        arAudio.play().catch(e => console.log("Audio waiting for interaction"));
      }

      arBtn.style.display = 'block';
      closeBtn.style.display = 'block';
    }

    function activateAR() {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      }
    }

    function closeAR() {
      viewer.style.display = 'none';
      viewer.src = '';
      arBtn.style.display = 'none';
      closeBtn.style.display = 'none';
      mainContent.style.display = 'block';
      bgVideo.style.opacity = '1';
      arAudio.pause();
    }

    viewer.addEventListener('progress', (e) => {
      document.getElementById('progress-bar').style.width = (e.detail.totalProgress * 100) + '%';
      if(e.detail.totalProgress === 1) {
        setTimeout(() => document.getElementById('progress-bar').style.width = '0%', 500);
      }
    });
  </script>
</body>
</html>
